name: Capturas reales de AB-Modbus Studio

on:
  push:
    branches: [main]
    paths:
      - 'ab_modbus/**'
      - 'tools/capture_screenshots.py'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar navegador para documentación
        run: |
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium
      - name: Comprobar funcionamiento del motor
        run: |
          python -m unittest discover -v
          python -m ab_modbus --self-test
      - name: Capturar aplicación en ejecución con el simulador
        run: python tools/capture_screenshots.py
      - name: Publicar también como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: AB-Modbus-Studio-capturas-reales
          path: docs/screenshots/*.png
          if-no-files-found: error
      - name: Incorporar PNG auténticos al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Las capturas ya coinciden con la versión actual"
          else
            git commit -m "docs: actual UI screenshots from Chromium and local Modbus simulator"
            git push origin HEAD:main
          fi
