name: Pruebas y portables
on:
  push:
    branches: [main, 'implementation/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - name: Verificar sintaxis del frontend SCADA
        run: node --check ab_modbus/web/scada.js
      - run: python -m ab_modbus --self-test
  portable:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: AB-Modbus-Studio-${{ runner.os }}
          path: dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Empaquetar y calcular SHA-256
        run: |
          chmod +x artifacts/AB-Modbus-Studio-Linux/AB-Modbus-Studio
          for directory in artifacts/*; do
            name=$(basename "$directory")
            (cd "$directory" && zip -r "../../$name.zip" .)
          done
          sha256sum AB-Modbus-Studio-*.zip > SHA256SUMS.txt
      - name: Crear borrador de Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" --draft --verify-tag --title "AB-Modbus Studio ${{ github.ref_name }}" --notes "Portables generados por CI. Revisar pruebas, licencias y hashes antes de publicar." AB-Modbus-Studio-*.zip SHA256SUMS.txt
